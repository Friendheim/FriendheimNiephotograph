<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FriendheimNie — Independent Photographer. Quiet moments, honestly observed. Portraits, landscapes, street and travel photography."
    />
    <meta name="theme-color" content="#F7F2EA" />
    <title>FriendheimNie — Independent Photographer</title>

    <!-- Social sharing preview (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FriendheimNie" />
    <meta property="og:title" content="FriendheimNie — Independent Photographer" />
    <meta
      property="og:description"
      content="Quiet moments, honestly observed. Photographs by FriendheimNie."
    />
    <meta
      property="og:image"
      content="https://friendheim.github.io/FriendheimNiephotograph/images/hero.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FriendheimNie — Independent Photographer" />
    <meta
      name="twitter:description"
      content="Quiet moments, honestly observed. Photographs by FriendheimNie."
    />
    <meta
      name="twitter:image"
      content="https://friendheim.github.io/FriendheimNiephotograph/images/hero.jpg"
    />

    <!-- Typography: editorial serif (Fraunces) + clean sans (Inter). Falls back to system fonts when offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before first paint to avoid flashing -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('fhn-theme')
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
